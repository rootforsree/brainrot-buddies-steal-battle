# Build performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official

# KSP: incremental processing is OFF. The template's CI hit the known KSP
# incremental-cache bug (JsonDecodingException EOF in IncrementalContextBase
# on :app:kspReleaseKotlin). Full KSP runs are deterministic; the speed cost
# is acceptable for this project size. Revisit only with a KSP upgrade that
# documents the fix.
ksp.incremental=false

# Android
android.useAndroidX=true
# NOTE: nonTransitiveRClass is the default in AGP 9 and the flag is deprecated.
# Kept for explicitness; remove when moving to AGP 10.
android.nonTransitiveRClass=true
