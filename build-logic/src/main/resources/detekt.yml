# Shared detekt config for the template (detekt 1.23.x).
# Fails the build on the skill's ban list: !!, GlobalScope, forbidden comments.

config:
  validation: true
  warningsAsErrors: true

build:
  maxIssues: 0
  excludeCorrectable: false

naming:
  active: true
  # Series convention: applicationId-derived package segments use underscores
  # (com.sreecharan.brainrot_buddies_steal_battle).
  PackageNaming:
    active: true
    packagePattern: '[a-z_]+(\.[a-z_][A-Za-z0-9_]*)*'
  # Compose convention: @Composable functions are PascalCase. detekt 1.23.8
  # has no ignoreAnnotated for FunctionNaming, so the pattern allows both.
  FunctionNaming:
    active: true
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'

comments:
  active: true

complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    threshold: 15
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 7
    ignoreDefaultParameters: false
  LargeClass:
    active: true
    threshold: 600

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  InjectDispatcher:
    active: true
  RedundantSuspendModifier:
    active: true

potential-bugs:
  active: true
  # The skill bans !! in production code (tests only).
  UnsafeCallOnNullableType:
    active: true

style:
  active: true
  ForbiddenComment:
    active: true
    comments:
      - 'TODO:'
      - 'FIXME:'
      - 'STOPSHIP:'
  MagicNumber:
    active: true
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
  MaxLineLength:
    active: true
    maxLineLength: 120
  WildcardImport:
    active: true
  ReturnCount:
    active: true
    max: 2
    excludedFunctions: ['equals']
