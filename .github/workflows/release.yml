# .github/workflows/release.yml — copy to .github/workflows/release.yml
# Push a tag (git tag v1.2.3 && git push origin v1.2.3): builds a signed release
# APK + AAB and publishes a GitHub Release with both attached.
# SETUP:
#   1. Run files/scripts/pin-actions.sh once to replace @v tags with SHAs.
#   2. Add the four ANDROID_KEYSTORE_* repository secrets (see skill section 2).
#   3. Wire signing in app/build.gradle.kts from env vars (see skill section 6).
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release

jobs:
  release:
    name: Signed release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Derive version from tag
        id: version
        run: |
          echo "version_name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Restore keystore (required)
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Signing secrets are missing. Failing instead of shipping debug-signed." >&2
            exit 1
          fi
          umask 077
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK + AAB
        run: >
          ./gradlew assembleRelease bundleRelease
          -PversionName="${{ steps.version.outputs.version_name }}"
          -PversionCode="${{ steps.version.outputs.version_code }}"
          --stacktrace
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify signature and write checksum
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n1)"
          "$BT/apksigner" verify --print-certs "$APK" | head -n 5
          sha256sum "$APK" > "$APK.sha256"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Delete keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.version.outputs.version_name }}
          generate_release_notes: true
          files: |
            ${{ env.APK_PATH }}
            ${{ env.APK_PATH }}.sha256
            app/build/outputs/bundle/release/app-release.aab
