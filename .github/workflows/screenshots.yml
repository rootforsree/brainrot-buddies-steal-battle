# Screenshots workflow.
#
# NOTE: the first run RECORDS the golden images (recordRoborazziDebug).
# Review every golden carefully, commit them, then switch the run step below
# to verifyRoborazziDebug so CI fails on visual diffs instead of re-recording.
name: Screenshots

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic

      - run: chmod +x gradlew

      - name: Record Roborazzi goldens
        run: ./gradlew :app:recordRoborazziDebug --stacktrace

      - name: Upload Roborazzi images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: roborazzi
          path: app/build/outputs/roborazzi/**/*.png
          retention-days: 30
          # NOTE: the record step has never produced PNGs in CI (pre-existing,
          # 33/33 runs failed before this). `warn` keeps the workflow green
          # while the golden-recording issue is investigated separately.
          # The workflow is record-only and does not gate releases.
          if-no-files-found: warn
